server:
  port: "${SERVER_PORT:8081}"
spring:
  application:
    name: "RequestsService"
  devtools:
    add-properties: false
  app:
    postgresql:
      host: "${DB_HOST:db}"
      port: "${DB_PORT:5432}"
      database: "${DB_NAME:loan_applications}"
      username: "${DB_USER:postgres}"
      password: "${DB_PASSWORD:postgrespws}"
    r2dbc:
      url: "${SPRING_R2DBC_URL:r2dbc:postgresql://${DB_HOST:db}:${DB_PORT:5432}/${DB_NAME:loan_applications}}"
      username: "${DB_USER:postgres}"
      password: "${DB_PASSWORD:postgrespws}"
    flyway:
      url: "${FLYWAY_URL:jdbc:postgresql://${DB_HOST:db}:${DB_PORT:5432}/${DB_NAME:loan_applications}}"
      user: "${DB_USER:postgres}"
      password: "${DB_PASSWORD:postgrespws}"
      locations: "classpath:db/migration"
cors:
  allowed-origins: "${CORS_ALLOWED_ORIGINS:http://localhost:4200,http://localhost:8081}"
customer:
  service:
    base-url: "${CUSTOMER_SERVICE_BASE_URL:http://authentication:8080}"
aws:
  region: ${AWS_REGION:us-east-2}
app:
  sqs:
    queue-url: ${SQS_QUEUE_URL}
