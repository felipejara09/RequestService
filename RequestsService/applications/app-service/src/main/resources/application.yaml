server:
  port: 8081
spring:
  application:
    name: "RequestsService"
  devtools:
    add-properties: false
  h2:
    console:
      enabled: true
      path: "/h2"
  profiles:
    include: null
management:
  app:
    postgresql:
      host: localhost
      port: 5432
      database: requests
      username: postgres
      password: postgrespws
  r2dbc:
    url: r2dbc:postgresql://localhost:5432/requests
    username: postgres
    password: postgrespws
    flyway:
      url: jdbc:postgresql://localhost:5432/requests
      user: postgres
      password: postgrespws
      locations: classpath:db/migration
  endpoints:
    web:
      exposure:
        include: "health,prometheus"
  endpoint:
    health:
      probes:
        enabled: true
cors:
  allowed-origins: "http://localhost:4200,http://localhost:8080"
